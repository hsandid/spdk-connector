[build-system]
requires = ["setuptools>=77", "wheel", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "lmcache-spdk-connector-kv"
version = "0.1.0"
description = "Direct NVMe Key-Value L2 connector foundation for LMCache"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["lmcache==0.5.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
